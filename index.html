<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>错题复习 · REVIEW v1.0.9</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ctext%20y='.9em'%20font-size='90'%3E%F0%9F%93%96%3C/text%3E%3C/svg%3E">
<meta name="version" content="1.0.9">
<link rel="stylesheet" href="theme.css?v=1.0.9&b=202611172355">
<link rel="stylesheet" href="style.css?v=1.0.9&b=202611172355">
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>错题复习<span class="h1en">REVIEW</span></h1>
      <div class="subtitle" id="hSub">总览</div>
      <div class="meta" id="hMeta"></div>
    </div>
    <div class="hacts">
      <button id="btnHome" hidden>返回总览</button>
    </div>
  </header>

  <div id="app"></div>
</div>

<footer class="foot">
  <span class="ver">v1.0.9</span>
  <a href="https://github.com/deepseek-ai/deepseek-harness" target="_blank" rel="noopener noreferrer">
    <img src="img/dsh-badge.png" alt="powered by dsh" width="121" height="20">
  </a>
</footer>

<button id="btnCalc" class="toolfab" type="button" data-act="calcToggle" aria-label="计算器" aria-expanded="false" title="计算器（答题时可用）">
  <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2.2"/><path d="M7.6 7.6h8.8M8.2 12h.02M12 12h.02M15.8 12h.02M8.2 15.8h.02M12 15.8h.02M15.8 15.8h.02"/></svg>
</button>
<div class="calcbox" id="calcBox" hidden>
  <div class="calcout" id="calcOut">0</div>
  <div class="calcgrid">
    <button type="button" class="fn" data-act="calcKey" data-k="C">C</button>
    <button type="button" class="fn" data-act="calcKey" data-k="back">←</button>
    <button type="button" class="fn" data-act="calcKey" data-k="(">(</button>
    <button type="button" class="fn" data-act="calcKey" data-k=")">)</button>
    <button type="button" data-act="calcKey" data-k="7">7</button>
    <button type="button" data-act="calcKey" data-k="8">8</button>
    <button type="button" data-act="calcKey" data-k="9">9</button>
    <button type="button" class="fn" data-act="calcKey" data-k="/">÷</button>
    <button type="button" data-act="calcKey" data-k="4">4</button>
    <button type="button" data-act="calcKey" data-k="5">5</button>
    <button type="button" data-act="calcKey" data-k="6">6</button>
    <button type="button" class="fn" data-act="calcKey" data-k="*">×</button>
    <button type="button" data-act="calcKey" data-k="1">1</button>
    <button type="button" data-act="calcKey" data-k="2">2</button>
    <button type="button" data-act="calcKey" data-k="3">3</button>
    <button type="button" class="fn" data-act="calcKey" data-k="-">−</button>
    <button type="button" data-act="calcKey" data-k="0">0</button>
    <button type="button" data-act="calcKey" data-k=".">.</button>
    <button type="button" class="eq" data-act="calcKey" data-k="=">=</button>
    <button type="button" class="fn" data-act="calcKey" data-k="+">+</button>
  </div>
</div>

<button id="btnTheme" class="themefab" type="button" aria-label="切换深浅色" title="切换深浅色">
  <svg class="ic-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.7A8.6 8.6 0 1 1 9.3 3.5a6.9 6.9 0 0 0 11.2 11.2z"/></svg>
  <svg class="ic-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.1"/><path d="M12 2.6v2.1M12 19.3v2.1M4.4 4.4l1.5 1.5M18.1 18.1l1.5 1.5M2.6 12h2.1M19.3 12h2.1M4.4 19.6l1.5-1.5M18.1 5.9l1.5-1.5"/></svg>
</button>

<div class="modal" id="modal">
  <div class="mmask" data-act="closeModal"></div>
  <div class="mbox" id="mbox"></div>
</div>
<div class="toast" id="toast"></div>

<script src="questions.js?v=1.0.9&b=202611172355"></script>
<script src="app.js?v=1.0.9&b=202611172355"></script>
</body>
</html>
